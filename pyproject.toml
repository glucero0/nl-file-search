[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-file-search"
version = "0.1.0"
description = "Natural-language local file search using Gemini Embedding 2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.40.0",
  "fastmcp>=2.0.0",
  "sqlite-vec>=0.1.6",
  "pypdf>=5.0.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
office = []
audio = []

[project.scripts]
nl-search = "nl_file_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
