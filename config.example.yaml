# Copy to ~/nl-file-search/config.yaml (see README Setup).
# nl-search does not create this file.
#
# Use forward slashes in double-quoted paths. "C:\Users\..." is invalid YAML
# because \U is a Unicode escape. "~/Notes" works on every OS.
sources:
  - path: "~/Notes"
  - path: "~/Pictures"
exclude:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.env"
  - "**/*credential*"
  - "**/*.pem"
embed:
  model: gemini-embedding-2
  dimensions: 768
video:
  max_seconds: 120
